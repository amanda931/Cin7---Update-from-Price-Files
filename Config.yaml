# ==============================================================================
# RHS Group Ltd - Cin7 Price & Catalogue Tool - Configuration
# ==============================================================================
# Format:  Key: Value          (lines starting with # are comments, and ignored)
# Edit the settings below before each run.
#
# This one script runs several modes. The GLOBAL block at the top applies to every
# run; the rest of the settings are grouped under the mode they belong to:
#
#   Price-file update (default) - read a supplier CSV, update cost + all tiers
#   Manufacturer uplift         - UPLIFT_MODE: True   (lift a brand's prices by %)
#   Tier audit                  - run with  --audit   (read-only health check)
#   Create missing products     - CREATE_MISSING: True (during a file run)
#   Deprecate discontinued      - DEPRECATE_MODE: True
#   Export catalogue to CSV     - run with  --export,  OR EXPORT_MODE: True (read-only)
#   Reactivate / retry          - run with  --reactivate  /  --retry
# ==============================================================================


# ==============================================================================
# GLOBAL  -  applies to every run
# ==============================================================================

# Preview vs live.  True = show what would change, write nothing.  False = apply.
# Always do a True (dry) run first.
DRY_RUN: False

# API calls per minute.  Stay below 60 to leave headroom for Zapier workflows.
RATE_LIMIT_PER_MIN: 55

# Which systems to write to (price-file update and uplift modes).
UPDATE_CIN7: True
UPDATE_SIMPRO: False
UPDATE_SHOPIFY: False

# Before any LIVE run, prompt to confirm the sync Zap(s) are turned OFF, so a bulk
# run doesn't fire a single-update Zap for every changed product.
# ZAP_NAME just labels the prompt.  Set ZAP_PAUSE_PROMPT: False to skip it.
ZAP_PAUSE_PROMPT: True
ZAP_NAME: Cin7 sync Zap(s)

# --- Channel pricing (price-file update and uplift modes) ---
# Each channel prices from its own Cin7 tier, so simPRO and Shopify are
# independent. Tiers are Tier1..Tier10 (Tier10 = the anchor, cost x multiplier).
#
# simPRO: price = SIMPRO_PRICE_TIER minus the product's discount rule (minimum
# 40% — the per-product DiscountRule still applies when it is deeper than 40%).
SIMPRO_PRICE_TIER: Tier4
#
# Shopify: price = SHOPIFY_PRICE_TIER minus SHOPIFY_DISCOUNT_PERCENT (a FLAT
# percentage — the per-product DiscountRule does NOT apply to Shopify).
# compare_at (the strike-through "was" price) = SHOPIFY_COMPARE_AT_TIER.
# Example: sell at Tier9 with no discount, show Tier5 as the was-price:
#   SHOPIFY_PRICE_TIER: Tier9   SHOPIFY_COMPARE_AT_TIER: Tier5   SHOPIFY_DISCOUNT_PERCENT: 0
SHOPIFY_PRICE_TIER: Tier4
SHOPIFY_COMPARE_AT_TIER: Tier4
SHOPIFY_DISCOUNT_PERCENT: 40


# ==============================================================================
# SCOPE & CATALOGUE  -  used by Uplift and Audit (both scan the whole catalogue)
# ==============================================================================

# --- Which products (brand / category) ---
# Leave both blank to process everything.
#   Uplift: refuses to run if BOTH are blank (safety net) - set at least one.
#   Audit : blank means the WHOLE catalogue.
# Examples:  BRAND_FILTER: EPH Controls      CATEGORY_FILTER: Central Heating Controls
BRAND_FILTER: Aqualla
CATEGORY_FILTER:

# Exclude "Bathroom Brands" so a run can't accidentally sweep ~72k products.
# Applies to uplift and to a whole-catalogue audit. Matched against both Brand and
# Category, case-insensitive.
EXCLUDE_BATHROOM_BRANDS: False

# --- Catalogue cache ---
# Cin7 ignores Brand/Category filters on its product endpoint, so the whole
# catalogue is scanned once (~7 min) and cached to catalogue_index.json, then
# filtered locally. The cache rebuilds automatically once it is older than
# CATALOGUE_MAX_AGE_HOURS, so there's nothing to manage by hand day to day.
CATALOGUE_MAX_AGE_HOURS: 24

# Force a rebuild on EVERY run regardless of age (e.g. right after adding new
# products you want included straight away). NOTE: the script never resets this -
# it forces a rebuild on every run until you set it back to False, so switch it
# off once you've had the fresh scan you wanted.
REFRESH_CATALOGUE: False


# ==============================================================================
# PRICE-FILE UPDATE  -  the default mode (runs when no other mode/flag is set)
# ==============================================================================
# Reads the supplier CSV and updates purchase cost + all price tiers.
# The price file IS the scope here - the Brand/Category filters above do NOT apply.
#
# WHICH FILE: the script reads "Sheet1.csv" from its own folder. To use a different
# file (e.g. an audit_fix file), copy or rename it to Sheet1.csv, or change
# PRICE_FILE_PATH near the top of the .py script. (That path is set in the script,
# not here in Config.)

# How file attributes (Barcode, Category, Brand, Discount, CostingMethod) are
# applied when Cin7 already has a value:
#   overwrite   = the file always wins (file is the source of truth)
#   fill_blank  = only set the attribute when Cin7's existing value is empty
# Blank cells never change anything, in either mode.
ATTRIBUTE_FILL_MODE: overwrite

# Clear each product's Cin7 markup rule before writing its fixed tiers?
#   True  = clear it per product (original behaviour; the safe choice while you are
#           still migrating markup-priced products onto fixed tiers).
#   False = skip that call - one fewer Cin7 call per product, ~25% faster runs.
# Set False ONLY if you intend to clear the markup rules in bulk yourself, in Cin7,
# afterwards. WARNING: a bulk clear in Cin7 strips the markup from EVERY product
# that still has one - including any your fixed-tier run did not cover (e.g. the
# no-supplier products the audit skips) - and those would drop to GBP 0.00. Before
# you bulk-clear, make sure every live, markup-priced product already has fixed
# tiers, or it will be left with no price at all.
REMOVE_MARKUP_PRICES: False

# --- Cost-decrease guard (file mode) ---
# Hold any SKU whose NEW supplier cost (from the file) is lower than the OLD cost
# already in Cin7. A held line writes NOTHING - no cost, no tiers, no simPRO/Shopify -
# and is logged with Action 'skipped_cost_decrease' so you can review it. This is the
# backstop against a mis-keyed file (e.g. a sort that de-syncs a column) quietly
# lowering live prices. Increases and unchanged lines apply as normal. Only guards
# products that already have a supplier cost in Cin7; new products and uplift mode
# are unaffected.
#   True  = hold cost reductions for review  [recommended]
#   False = apply cost reductions without holding
# After reviewing the held lines, push the genuine ones through with:
#     python cin7_price_updater.py --retry last --allow-decreases
BLOCK_COST_DECREASES: True

# Rounding slack, in pounds. A drop within this much is treated as rounding and let
# through; only a larger reduction is held. Raise it if your cost maths rounds loosely.
COST_DECREASE_TOLERANCE: 0.02

# --- Hard price reset (file mode only) ---
# Normally Tier10 is RATCHETED: max(file cost, existing Tier10, cost x multiplier/2)
# - selling prices can rise but never fall, whatever the file says.
# HARD_RESET_PRICES: True re-anchors Tier10 strictly from file cost x multiplier
# (floored at cost, so nothing is ever priced below what you pay). This is the
# ONLY way selling tiers can DECREASE - use it to push a genuine reprice-down or
# to correct inflated tiers. Live runs demand a typed CONFIRM on top of the
# usual gates. Cost decreases are still held by BLOCK_COST_DECREASES above -
# for a file that also cuts costs, run with --allow-decreases.
# Set back to False after the reset run.
HARD_RESET_PRICES: False


# ==============================================================================
# MANUFACTURER UPLIFT  -  UPLIFT_MODE: True
# ==============================================================================
# Instead of reading a price file, finds every product matching the Brand/Category
# filters (in SCOPE above) and lifts each one's existing Tier10 anchor by
# UPLIFT_PERCENT, recomputing all tiers (and simPRO/Shopify) from the new anchor.
# A live run shows a pre-flight count and needs a typed CONFIRM, on top of the
# business-hours check. Always DRY_RUN first.

UPLIFT_MODE: False

# Percentage to add (e.g. 5 = +5%).
UPLIFT_PERCENT: 7

# False = move selling prices only, hold the supplier (buy) cost until you have the
#         real price file  [recommended default]
# True  = also raise the supplier cost by the same %, treating the announced
#         increase as the true cost change.
UPLIFT_SUPPLIER_COST: False

# Double-run guard: before applying, fetch live prices and SKIP any product whose
# Tier10 already sits above what its supplier cost justifies (i.e. already uplifted).
# Set False to skip the check.
UPLIFT_GUARD: True

# The buying supplier to measure the guard against on products that have more than
# one supplier. Blank = use each product's highest-priced supplier.
UPLIFT_DEFAULT_SUPPLIER:


# ==============================================================================
# TIER AUDIT  -  run with  --audit,  OR set AUDIT_MODE: True below
# ==============================================================================
# Read-only. Scans the catalogue and lists products whose tiers don't match what
# their supplier cost should produce. Writes a diagnostic CSV plus a Sheet1-format
# re-price file you can feed back through the price-file update.
# Honours the Brand/Category filters in SCOPE above (blank = whole catalogue).

# Trigger the audit without the command-line switch. True = run the read-only
# audit instead of a normal update; same effect as passing --audit (the switch
# still works too). It never writes, so it's safe to leave on while you work
# through drift - just set it back to False before a real price run.
AUDIT_MODE: False

# >>> TO APPLY AN AUDIT'S FIXES (turn the report into a real update):
#     1. Copy the newest audit_fix_<timestamp>.csv (written to this folder) onto
#        Sheet1.csv. In PowerShell, from this folder:
#            Copy-Item "audit_fix_<timestamp>.csv" "Sheet1.csv"
#     2. Set AUDIT_MODE back to False (above) so the script UPDATES, not re-audits.
#     3. DRY_RUN: True for a preview, then DRY_RUN: False to write the changes.
#     (Leave CREATE_MISSING: False - an audit_fix file only lists products that
#      already exist, so there is nothing to create.)

# Skip the unpriced (old-markup) backlog and report only genuinely mispriced
# products. Same as adding 'priced' after --audit.
AUDIT_SKIP_UNPRICED: False

# A tier is only flagged when it is off by BOTH of these at once - at least this
# percent of the expected price AND at least this many pence - so penny rounding is
# never flagged. Genuine drift clears both bars easily.
AUDIT_TOLERANCE_PERCENT: 1
AUDIT_TOLERANCE_PENCE: 2


# ==============================================================================
# EXPORT CATALOGUE  -  run with  --export,  OR set EXPORT_MODE: True below
# ==============================================================================
# Read-only. Writes every product matching BRAND_FILTER / CATEGORY_FILTER (in
# SCOPE above - at least one must be set) to Export1.csv in this folder, in Cin7
# Inventory List format. The WHOLE catalogue is scanned with suppliers
# (~2-7 min), cached to export_cache.json and reused for 24h - same rule as the
# catalogue index - then filtered locally, so switching Brand/Category between
# exports costs nothing. REFRESH_CATALOGUE: True forces a rescan.
# Headers: if a file called Cin7Template.csv exists in Helpers\ or in this
# folder (a real Cin7 Inventory List export - Inventory > Products > Export),
# its header row is copied exactly so the file re-imports cleanly; otherwise a
# built-in Cin7 Core header set is used. Set back to False after the export.
EXPORT_MODE: False
EXPORT_USE_TEMPLATE: True

# ==============================================================================
# CREATE MISSING PRODUCTS  -  CREATE_MISSING: True  (file mode only)
# ==============================================================================
# Any SKU in the price file NOT found in Cin7 is CREATED instead of erroring.
# Run DRY_RUN first - you'll see a "[DRY RUN] CREATE ..." line per new SKU and an
# update/create split before anything is written. New products take their
# boilerplate from the NEW_PRODUCT_* values below; per-row Category / Brand /
# Barcode / CostingMethod / Discount / Supplier columns override the defaults.
# Category is REQUIRED for a create - supply a column or set the default below.
CREATE_MISSING: True

# --- Boilerplate applied to every new product ---
NEW_PRODUCT_TYPE: Stock
NEW_PRODUCT_COSTING_METHOD: FIFO
NEW_PRODUCT_UOM: Each
NEW_PRODUCT_LOCATION: Warehouse
NEW_PRODUCT_INVENTORY_ACCOUNT: 300
NEW_PRODUCT_COGS_ACCOUNT: 310
NEW_PRODUCT_REVENUE_ACCOUNT: 240
NEW_PRODUCT_PURCHASE_TAX_RULE: 20% (VAT on Expenses)
NEW_PRODUCT_SALE_TAX_RULE: 20% (VAT on Income)
NEW_PRODUCT_ATTRIBUTE_SET: Product Details
NEW_PRODUCT_MULTIPLIER: 2.1
NEW_PRODUCT_DROPSHIP: No Drop Ship

# --- Fallbacks, used only when a file row leaves these blank ---
# (Serial-tracked items, e.g. boilers/filters: put "Serial" in a CostingMethod
#  column on those rows - it maps to "FIFO - Serial Number".)
NEW_PRODUCT_DEFAULT_CATEGORY: Bathroom Brands
NEW_PRODUCT_DEFAULT_BRAND: Bathrooms to Love

# Attach the file Cost to this supplier on new products. Blank = create with correct
# selling prices but NO supplier-cost row (add via your PO process). Must be an
# existing Cin7 supplier name; a "Supplier" column overrides this per row.
NEW_PRODUCT_SUPPLIER: PJH Group

# ==============================================================================
# DESCRIPTION ENRICHER  -  run:  python cin7_description_enricher.py
# ==============================================================================
# Standalone batch port of the Zapier OpenAI description-enrichment step (same
# prompt, schema and safety gates). Targets products matching BRAND_FILTER /
# CATEGORY_FILTER (in SCOPE above) where AdditionalAttribute8 is not "true"
# and the description is blank. Honours DRY_RUN above. NEVER run at the same
# time as a live price run or the enrichment Zap (both write AdditionalAttrs).
# Requires OPENAI_API_KEY in C:\Python\Credentials.txt.

# Maximum products enriched per run (each one is a billable OpenAI call).
ENRICH_MAX_PRODUCTS: 5

# OpenAI model (matches the Zap).
ENRICH_MODEL: gpt-5.4-mini

# Cin7 field the description is written to.
ENRICH_DESCRIPTION_FIELD: Description

# True = only write when the description field is blank (recommended).
ENRICH_ONLY_IF_BLANK: True

# Search terms (AdditionalAttribute3-6): blank_only or overwrite.
ENRICH_SEARCH_TERMS_MODE: blank_only

# Minimum OpenAI confidence for the exact-product lane.
ENRICH_MIN_CONFIDENCE: 0.85

# Barcode: only write when Cin7's is blank; minimum research confidence.
ENRICH_BARCODE_ONLY_IF_BLANK: True
ENRICH_MIN_BARCODE_CONFIDENCE: 0.90

# Cin7 field used as the manufacturer/brand source.
ENRICH_MANUFACTURER_FIELD: Brand

# ==============================================================================
# DEPRECATE DISCONTINUED PRODUCTS  -  DEPRECATE_MODE: True
# ==============================================================================
# Reads the price file as a COMPLETE keep-list for ONE brand and deprecates that
# brand's products that are NOT in the file (holding any still in stock / on order).
# Writes an undo file; reverse it with  --reactivate.
# Always DRY_RUN first, and use a COMPLETE single-brand file (not a test file).
DEPRECATE_MODE: False
DEPRECATE_STATUS: Deprecated
DEPRECATE_HOLD_ON_ORDER: True
DEPRECATE_DISPLAY_LIMIT: 200
